<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Two movers carrying a packed box up a ramp into a Vennila Packers and Movers truck">
  <defs>
    <linearGradient id="cargo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3EAF3"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC933"/>
      <stop offset="1" stop-color="#F0A800"/>
    </linearGradient>
    <g id="box">
      <rect width="56" height="42" rx="3" fill="#D9A35B"/>
      <rect x="22" width="12" height="42" fill="#C08A44"/>
      <rect x="6" y="28" width="12" height="7" rx="1" fill="#F5F8FC" opacity=".85"/>
    </g>
  </defs>

  <!-- Backdrop -->
  <circle cx="330" cy="170" r="150" fill="#FFFFFF" opacity=".05"/>
  <circle cx="330" cy="170" r="110" fill="#FFFFFF" opacity=".04"/>
  <g stroke="#FFFFFF" stroke-linecap="round" opacity=".28" stroke-width="4">
    <path d="M8 170h36M18 192h26M4 214h40"/>
  </g>

  <!-- Ground -->
  <rect x="20" y="291" width="610" height="4" rx="2" fill="#FFFFFF" opacity=".18"/>
  <ellipse cx="245" cy="294" rx="200" ry="7" fill="#000000" opacity=".22"/>

  <!-- Truck: cargo body -->
  <rect x="150" y="88" width="276" height="156" rx="10" fill="url(#cargo)"/>
  <rect x="150" y="206" width="276" height="12" fill="#FFB800"/>
  <text x="288" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="800" fill="#0B2345" letter-spacing="1">VENNILA</text>
  <text x="288" y="188" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#123F70" letter-spacing="3.5">PACKERS &amp; MOVERS</text>
  <!-- Small box logo on cargo -->
  <path d="M182 112l14-7 14 7v15l-14 7-14-7z" fill="#FFB800"/>
  <path d="M182 112l14 7 14-7M196 119v15" fill="none" stroke="#0B2345" stroke-width="2"/>

  <!-- Open rear door + ramp -->
  <rect x="426" y="90" width="9" height="152" rx="2" fill="#C9D5E3"/>
  <path d="M424 244h10l86 48h-14z" fill="#8FA6C2"/>
  <path d="M434 244l86 48" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="2"/>

  <!-- Cab -->
  <path d="M150 124h-44c-14 0-22 8-28 20l-14 34c-2 5-3 10-3 16v50h89z" fill="url(#cab)"/>
  <path d="M108 136h34v46H74l12-30c4-10 10-16 22-16z" fill="#BFE1F5"/>
  <path d="M112 140l-18 38" stroke="#FFFFFF" stroke-width="5" stroke-opacity=".6" stroke-linecap="round"/>
  <rect x="120" y="196" width="18" height="4" rx="2" fill="#B07A00"/>
  <rect x="58" y="226" width="18" height="12" rx="3" fill="#FFF3C4"/>

  <!-- Chassis & bumper -->
  <rect x="52" y="236" width="382" height="14" rx="5" fill="#16273F"/>
  <rect x="46" y="232" width="20" height="16" rx="4" fill="#C9D5E3"/>

  <!-- Wheels -->
  <g>
    <circle cx="116" cy="266" r="26" fill="#0A1628"/>
    <circle cx="116" cy="266" r="12" fill="#AAB8C8"/>
    <circle cx="116" cy="266" r="4" fill="#0A1628"/>
    <circle cx="360" cy="266" r="26" fill="#0A1628"/>
    <circle cx="360" cy="266" r="12" fill="#AAB8C8"/>
    <circle cx="360" cy="266" r="4" fill="#0A1628"/>
  </g>

  <!-- Stacked boxes waiting -->
  <use href="#box" x="570" y="250"/>
  <use href="#box" x="578" y="208" transform="rotate(-3 606 229)"/>
  <rect x="600" y="186" width="22" height="22" rx="2" fill="#E8B76E"/>
  <rect x="608" y="186" width="6" height="22" fill="#C08A44"/>

  <!-- Mover A (on the ramp) -->
  <g>
    <rect x="447" y="226" width="8" height="34" rx="3" fill="#1C4E86"/>
    <rect x="457" y="222" width="8" height="36" rx="3" fill="#1C4E86" transform="rotate(10 461 222)"/>
    <rect x="443" y="258" width="14" height="6" rx="3" fill="#0A1628"/>
    <rect x="457" y="255" width="14" height="6" rx="3" fill="#0A1628" transform="rotate(10 464 258)"/>
    <rect x="444" y="178" width="26" height="50" rx="9" fill="#FFB800"/>
    <rect x="444" y="200" width="26" height="5" fill="#E6A600"/>
    <circle cx="457" cy="164" r="12" fill="#B9794A"/>
    <path d="M445 162a12 12 0 0 1 24 0z" fill="#F5F8FC"/>
    <rect x="464" y="158" width="11" height="4" rx="2" fill="#F5F8FC"/>
  </g>

  <!-- Mover B (on the ground) -->
  <g>
    <rect x="552" y="256" width="8" height="34" rx="3" fill="#1C4E86" transform="rotate(-8 556 256)"/>
    <rect x="563" y="256" width="8" height="34" rx="3" fill="#1C4E86"/>
    <rect x="545" y="286" width="14" height="6" rx="3" fill="#0A1628"/>
    <rect x="561" y="286" width="14" height="6" rx="3" fill="#0A1628"/>
    <rect x="548" y="208" width="26" height="50" rx="9" fill="#FFB800"/>
    <rect x="548" y="230" width="26" height="5" fill="#E6A600"/>
    <circle cx="561" cy="194" r="12" fill="#8E5B36"/>
    <path d="M549 192a12 12 0 0 1 24 0z" fill="#F5F8FC"/>
    <rect x="543" y="188" width="11" height="4" rx="2" fill="#F5F8FC"/>
  </g>

  <!-- Box being carried (tilted along the ramp) -->
  <g transform="rotate(14 508 212)">
    <rect x="470" y="190" width="78" height="44" rx="3" fill="#D9A35B"/>
    <rect x="503" y="190" width="12" height="44" fill="#C08A44"/>
    <text x="532" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#7A4F1A">FRAGILE</text>
  </g>

  <!-- Arms (drawn over the box) -->
  <g stroke-linecap="round" fill="none">
    <path d="M466 186l10 18 4 2" stroke="#FFB800" stroke-width="8"/>
    <circle cx="481" cy="206" r="5" fill="#B9794A"/>
    <path d="M552 214l-10 14-2 4" stroke="#FFB800" stroke-width="8"/>
    <circle cx="539" cy="233" r="5" fill="#8E5B36"/>
  </g>
</svg>
